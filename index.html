<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="自動掃描 GitHub Pages 儲存庫中的 HTML 簡報">
<title>研究簡報庫</title>
<style>
:root{--navy:#17324d;--teal:#2a6f73;--coral:#ef8354;--sand:#f7f4ef;--ink:#24343d;--muted:#60747b;--line:#d8e1e1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#102a43,#17324d 55%,#2a6f73);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}header{padding:56px max(24px,6vw) 30px;color:#fff}header h1{font-size:clamp(38px,5vw,68px);margin:.1em 0}header p{max-width:760px;color:#d8e6e7;font-size:18px;line-height:1.65}.shell{width:min(1160px,calc(100% - 32px));margin:0 auto 50px;padding:clamp(22px,4vw,44px);background:var(--sand);border-radius:24px;box-shadow:0 24px 70px #06121f66}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.search{flex:1;min-width:220px;border:2px solid var(--line);border-radius:999px;padding:12px 18px;font:inherit;background:#fff}.search:focus{outline:3px solid #e9b44c;border-color:var(--teal)}.button{border:0;border-radius:999px;padding:12px 20px;background:var(--coral);color:#fff;font:inherit;font-weight:900;cursor:pointer}.button:focus-visible,.card a:focus-visible{outline:4px solid #e9b44c;outline-offset:3px}.status{color:var(--teal);font-weight:800;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{display:flex;flex-direction:column;min-height:190px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px #17324d12}.card h2{margin:0 0 10px;color:var(--navy);font-size:20px;overflow-wrap:anywhere}.card p{flex:1;color:var(--muted);font-size:14px;line-height:1.55;overflow-wrap:anywhere}.card a{align-self:flex-start;padding:10px 16px;border-radius:999px;background:var(--teal);color:#fff;text-decoration:none;font-weight:900}.empty,.error{grid-column:1/-1;padding:36px;text-align:center;color:var(--muted);background:#fff;border-radius:18px}.error{color:#8a4430;background:#fff2ed}.small{margin-top:24px;color:var(--muted);font-size:13px;line-height:1.6}@media(max-width:600px){.shell{border-radius:18px}.toolbar>*{width:100%}}
</style>
</head>
<body>
<header><div>GitHub Pages</div><h1>研究簡報庫</h1><p>本頁會自動讀取目前 GitHub 儲存庫中的 HTML 簡報。新增簡報只需上傳新的 HTML 檔案，不必修改首頁。</p></header>
<main class="shell">
<div class="toolbar"><input id="search" class="search" type="search" placeholder="搜尋簡報名稱或路徑" aria-label="搜尋簡報"><button id="reload" class="button" type="button">重新整理</button></div>
<p id="status" class="status" aria-live="polite">正在讀取簡報清單...</p>
<section id="grid" class="grid" aria-label="簡報列表"></section>
<p class="small">清單來源為公開的 GitHub REST API。首頁會排除 index.html、404.html，以及 .github、node_modules、vendor 目錄內的檔案。</p>
</main>
<script>
(() => {
  'use strict';
  const grid = document.querySelector('#grid');
  const status = document.querySelector('#status');
  const search = document.querySelector('#search');
  const reload = document.querySelector('#reload');
  let presentations = [];

  const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const titleFromPath = path => decodeURIComponent(path.split('/').pop()).replace(/\.html?$/i, '').replace(/[_-]+/g, ' ').trim();

  function getRepositoryInfo() {
    const host = location.hostname.toLowerCase();
    if (!host.endsWith('.github.io')) throw new Error('無法從自訂網域判斷 GitHub 儲存庫。請使用標準 username.github.io 網址。');
    const owner = host.replace(/\.github\.io$/, '');
    const firstPath = location.pathname.split('/').filter(Boolean)[0] || '';
    const isUserSite = !firstPath || firstPath.toLowerCase() === `${owner}.github.io`;
    const repo = isUserSite ? `${owner}.github.io` : firstPath;
    return { owner, repo };
  }

  function render() {
    const keyword = search.value.trim().toLocaleLowerCase('zh-Hant');
    const list = presentations.filter(item => `${item.title} ${item.path}`.toLocaleLowerCase('zh-Hant').includes(keyword));
    status.textContent = keyword ? `找到 ${list.length} 份符合條件的簡報` : `共 ${list.length} 份簡報`;
    if (!list.length) { grid.innerHTML = '<div class="empty">目前沒有符合條件的 HTML 簡報。</div>'; return; }
    grid.innerHTML = list.map(item => `<article class="card"><h2>${escapeHtml(item.title)}</h2><p>${escapeHtml(item.path)}</p><a href="${encodeURI(item.relativeUrl)}">開啟簡報 →</a></article>`).join('');
  }

  async function loadPresentations() {
    grid.innerHTML = '<div class="empty">正在從 GitHub 讀取檔案...</div>';
    status.textContent = '正在讀取簡報清單...';
    reload.disabled = true;
    try {
      const { owner, repo } = getRepositoryInfo();
      const repoResponse = await fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`, { headers: { 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' } });
      if (!repoResponse.ok) throw new Error(`無法讀取儲存庫資料（HTTP ${repoResponse.status}）`);
      const repoData = await repoResponse.json();
      const branch = repoData.default_branch;
      const treeResponse = await fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/trees/${encodeURIComponent(branch)}?recursive=1`, { headers: { 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' } });
      if (!treeResponse.ok) throw new Error(`無法讀取檔案清單（HTTP ${treeResponse.status}）`);
      const treeData = await treeResponse.json();
      const pageBase = repo === `${owner}.github.io` ? '/' : `/${repo}/`;
      presentations = treeData.tree.filter(item => item.type === 'blob' && /\.html?$/i.test(item.path) && !/(^|\/)(index|404)\.html?$/i.test(item.path) && !/(^|\/)(\.github|node_modules|vendor)\//i.test(item.path)).map(item => ({ path:item.path, title:titleFromPath(item.path), relativeUrl:`${pageBase}${item.path}` })).sort((a,b) => a.title.localeCompare(b.title, 'zh-Hant'));
      render();
      if (treeData.truncated) status.textContent += '（儲存庫檔案過多，GitHub 回傳結果可能不完整）';
    } catch (error) {
      presentations = [];
      status.textContent = '載入失敗';
      grid.innerHTML = `<div class="error"><strong>無法建立簡報清單</strong><br>${escapeHtml(error.message)}<br><br>請確認儲存庫為 Public、GitHub Pages 已啟用，並從 Pages 網址開啟本頁。</div>`;
    } finally { reload.disabled = false; }
  }

  search.addEventListener('input', render);
  reload.addEventListener('click', loadPresentations);
  loadPresentations();
})();
</script>
</body>
</html>
